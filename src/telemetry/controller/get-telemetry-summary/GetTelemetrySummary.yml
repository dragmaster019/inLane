# GetTelemetrySummary.yml — route contract for Part 2 (same style as ingest yml).

service: inlane-telemetry-summary
handler: src/telemetry/controller/get-telemetry-summary/GetTelemetrySummary.getTelemetrySummaryHandler

http:
  - method: GET
    path: /api/v1/telemetry/summary
    handler: getTelemetrySummaryHandler
    queryParams:
      - device_id # required, non-empty string
      - from      # required, epoch millis int, inclusive
      - to        # required, epoch millis int, inclusive
    successStatus: 200
    failureStatus: 400 # missing param or from > to

environment:
  DB_HOST: ${env:DB_HOST}
  DB_PORT: ${env:DB_PORT}
  DB_USER: ${env:DB_USER}
  DB_PASSWORD: ${env:DB_PASSWORD}
  DB_NAME: ${env:DB_NAME}
  LOG_LEVEL: ${env:LOG_LEVEL}

notes:
  - Single SQL aggregate (COUNT, AVG, MAX(SQRT)) over indexed range, no full scan.
  - Empty window returns event_count 0 + nulls with HTTP 200.
