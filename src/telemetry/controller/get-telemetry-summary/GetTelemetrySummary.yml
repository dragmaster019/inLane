# summary route
service: inlane-telemetry-summary
handler: src/telemetry/controller/get-telemetry-summary/GetTelemetrySummary.getTelemetrySummaryHandler

http:
  - method: GET
    path: /api/v1/telemetry/summary
    handler: getTelemetrySummaryHandler
    queryParams:
      - device_id
      - from
      - to
    successStatus: 200
    failureStatus: 400

environment:
  DB_HOST: ${env:DB_HOST}
  DB_PORT: ${env:DB_PORT}
  DB_USER: ${env:DB_USER}
  DB_PASSWORD: ${env:DB_PASSWORD}
  DB_NAME: ${env:DB_NAME}
  LOG_LEVEL: ${env:LOG_LEVEL}
