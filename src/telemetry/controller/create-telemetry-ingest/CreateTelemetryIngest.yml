# ingest route
service: inlane-telemetry-ingest
handler: src/telemetry/controller/create-telemetry-ingest/CreateTelemetryIngest.createTelemetryIngestHandler

http:
  - method: POST
    path: /api/v1/telemetry/ingest
    handler: createTelemetryIngestHandler
    bodyLimit: 1mb
    successStatus: 200
    requestFailureStatus: 400

environment:
  DB_HOST: ${env:DB_HOST}
  DB_PORT: ${env:DB_PORT}
  DB_USER: ${env:DB_USER}
  DB_PASSWORD: ${env:DB_PASSWORD}
  DB_NAME: ${env:DB_NAME}
  LOG_LEVEL: ${env:LOG_LEVEL}

